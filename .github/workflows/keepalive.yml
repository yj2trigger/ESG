name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable scheduled workflows
        run: |
          gh workflow enable relay.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}