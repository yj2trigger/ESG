name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            project/backend/requirements.txt
            project/backend/requirements-test.txt

      - name: Install dependencies
        run: |
          cd project/backend
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: |
          cd project/backend
          python -m pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/frontend/package.json

      - name: Install dependencies
        run: cd project/frontend && npm install

      - name: Run vitest
        run: cd project/frontend && npm test

  deploy-backend:
    name: Deploy Backend → Fly.io
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly.io secrets
        if: ${{ secrets.SMARTTHINGS_PAT != '' }}
        run: flyctl secrets set SMARTTHINGS_PAT="$SMARTTHINGS_PAT" --app esg-laundry-checker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SMARTTHINGS_PAT: ${{ secrets.SMARTTHINGS_PAT }}

      - name: Deploy backend
        run: flyctl deploy --remote-only --strategy=immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
