name: CI

# 현재는 수동 실행만 가능 (workflow_dispatch)
# 팀 협업 또는 실배포 전환 시 아래 주석을 해제하세요:
# on:
#   pull_request:
#     branches: [main]

on:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd project/backend
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: |
          cd project/backend
          pytest tests/ -v

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: cd project/frontend && npm ci

      - name: Run tests
        run: cd project/frontend && npm run test

      - name: Type check
        run: cd project/frontend && npx tsc --noEmit
