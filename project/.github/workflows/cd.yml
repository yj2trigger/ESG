name: CD

on:
  push:
    branches: [main]

# 사전 설정 필요:
# GitHub → Settings → Secrets:
#   FLY_API_TOKEN     — fly.io 토큰 (fly tokens create deploy)
#   VERCEL_TOKEN      — Vercel 토큰 (vercel.com → Settings → Tokens)
#   VERCEL_ORG_ID     — vercel.com → Settings → General → Team ID
#   VERCEL_PROJECT_ID — .vercel/project.json의 projectId (vercel link 실행 후 확인)
#
# Fly.io 환경변수 (fly secrets set 으로 설정):
#   DATABASE_URL  — Supabase PostgreSQL connection string
#   SECRET_KEY    — JWT 서명 키 (openssl rand -hex 32)
#   CORS_ORIGINS  — https://<vercel-domain>.vercel.app
#
# Vercel 환경변수 (Vercel 대시보드에서 설정):
#   VITE_API_URL  — https://<fly-app>.fly.dev
#   VITE_WS_URL   — wss://<fly-app>.fly.dev

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            project/backend/requirements.txt
            project/backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

  deploy-backend:
    name: Deploy Backend → Fly.io
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend
        working-directory: project/frontend
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}