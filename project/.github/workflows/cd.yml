name: CD

on:
  push:
    branches: [main]

# 사전 설정 필요:
# GitHub → Settings → Secrets → RAILWAY_TOKEN (Railway 프로젝트 토큰)
# GitHub → Settings → Variables → RAILWAY_BACKEND_SERVICE (Railway 백엔드 서비스 이름)
# GitHub → Settings → Variables → RAILWAY_FRONTEND_SERVICE (Railway 프론트엔드 서비스 이름)
# Railway → 각 서비스 → Settings → Root Directory 설정 (backend/, frontend/)
# Railway → frontend 서비스 환경변수:
#   VITE_API_URL=https://<백엔드-Railway-URL>
#   VITE_WS_URL=wss://<백엔드-Railway-URL>

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

  deploy-backend:
    name: Deploy Backend → Railway
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        working-directory: backend
        run: railway up --service ${{ vars.RAILWAY_BACKEND_SERVICE }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend → Railway
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend
        working-directory: frontend
        run: railway up --service ${{ vars.RAILWAY_FRONTEND_SERVICE }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}